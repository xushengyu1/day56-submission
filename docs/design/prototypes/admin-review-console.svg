<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #172033; }
      .muted { fill: #667085; }
      .small { font-size: 14px; }
      .label { font-size: 15px; font-weight: 600; }
      .title { font-size: 28px; font-weight: 700; }
      .h2 { font-size: 20px; font-weight: 700; }
      .card { fill: #ffffff; stroke: #dbe3f0; stroke-width: 1.5; }
      .primary { fill: #1e40af; }
      .soft { fill: #eff6ff; }
      .danger { fill: #fef2f2; stroke: #fca5a5; }
      .warning { fill: #fff7ed; stroke: #fdba74; }
      .success { fill: #ecfdf3; stroke: #86efac; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f4f6fa"/>
  <rect x="0" y="0" width="1440" height="68" fill="#111827"/>
  <text x="30" y="43" font-size="22" font-weight="700" fill="#ffffff">失物招领 · 管理员复核台</text>
  <rect x="1120" y="17" width="142" height="34" rx="17" fill="#374151"/>
  <text x="1141" y="40" class="small" fill="#ffffff">ADMIN 最小权限</text>
  <circle cx="1312" cy="34" r="17" fill="#475569"/>
  <text x="1340" y="40" class="small" fill="#ffffff">admin</text>

  <rect x="0" y="68" width="216" height="832" fill="#172033"/>
  <rect x="14" y="96" width="188" height="46" rx="8" fill="#1e40af"/>
  <text x="40" y="126" class="label" fill="#ffffff">待复核队列</text>
  <text x="40" y="180" class="label" fill="#cbd5e1">已处理记录</text>
  <text x="40" y="232" class="label" fill="#cbd5e1">审计查询</text>
  <line x1="24" y1="272" x2="192" y2="272" stroke="#374151"/>
  <text x="40" y="310" class="small" fill="#94a3b8">权限提示</text>
  <text x="40" y="340" class="small" fill="#cbd5e1">默认不可见：</text>
  <text x="40" y="370" class="small" fill="#cbd5e1">• 完整证件号码</text>
  <text x="40" y="398" class="small" fill="#cbd5e1">• 原始联系方式</text>
  <text x="40" y="426" class="small" fill="#cbd5e1">• 未授权原图</text>

  <text x="248" y="114" class="title">异常认领复核</text>
  <text x="248" y="142" class="small muted">仅处理重复记录、冲突、低可信、尝试超限和 AI 异常。</text>

  <rect x="248" y="166" width="1160" height="58" rx="10" class="card"/>
  <rect x="268" y="179" width="244" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="286" y="202" class="small muted">搜索申请 ID / 掩码号码</text>
  <rect x="530" y="179" width="142" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="550" y="202" class="small">全部风险类型⌄</text>
  <rect x="688" y="179" width="142" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="710" y="202" class="small">全部物品类型⌄</text>
  <rect x="1268" y="179" width="116" height="34" rx="6" class="primary"/>
  <text x="1294" y="202" class="small" fill="#ffffff">刷新队列</text>

  <rect x="248" y="246" width="400" height="616" rx="14" class="card"/>
  <text x="272" y="282" class="h2">待复核 3</text>
  <rect x="268" y="304" width="360" height="132" rx="10" class="soft" stroke="#93c5fd" stroke-width="2"/>
  <rect x="286" y="324" width="98" height="28" rx="14" class="warning"/>
  <text x="300" y="344" class="small" fill="#c2410c">重复身份证</text>
  <text x="400" y="343" class="label">110***********123X</text>
  <text x="286" y="376" class="small">两条活动招领记录命中同一 HMAC</text>
  <text x="286" y="405" class="small muted">申请 CLM-1024 · 2 分钟前</text>
  <rect x="268" y="452" width="360" height="118" rx="10" class="card"/>
  <rect x="286" y="470" width="86" height="28" rx="14" class="danger"/>
  <text x="301" y="490" class="small" fill="#b91c1c">关键冲突</text>
  <text x="388" y="490" class="label">黑色折叠伞</text>
  <text x="286" y="522" class="small">隐藏问题存在颜色/位置冲突</text>
  <text x="286" y="548" class="small muted">申请 CLM-1025 · 8 分钟前</text>
  <rect x="268" y="586" width="360" height="118" rx="10" class="card"/>
  <rect x="286" y="604" width="86" height="28" rx="14" class="warning"/>
  <text x="301" y="624" class="small" fill="#c2410c">AI 异常</text>
  <text x="388" y="624" class="label">蓝牙耳机</text>
  <text x="286" y="656" class="small">回答核验超时，未自动放行</text>
  <text x="286" y="682" class="small muted">申请 CLM-1026 · 15 分钟前</text>

  <rect x="670" y="246" width="738" height="616" rx="14" class="card"/>
  <text x="696" y="282" class="h2">复核详情 · CLM-1024</text>
  <rect x="1248" y="260" width="130" height="30" rx="15" class="warning"/>
  <text x="1266" y="281" class="small" fill="#c2410c">禁止自动待交接</text>

  <rect x="696" y="306" width="326" height="142" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="716" y="336" class="label">候选与规则结果</text>
  <text x="716" y="368" class="small">类型：居民身份证</text>
  <text x="716" y="396" class="small">掩码：110***********123X</text>
  <text x="716" y="424" class="small">号码核验：精确匹配</text>
  <rect x="1042" y="306" width="336" height="142" rx="10" class="danger"/>
  <text x="1062" y="336" class="label" fill="#b91c1c">风险原因</text>
  <text x="1062" y="368" class="small">相同 HMAC 活动记录：2 条</text>
  <text x="1062" y="396" class="small">尝试次数：1 / 2</text>
  <text x="1062" y="424" class="small">系统动作：转管理员复核</text>

  <text x="696" y="486" class="h2">重复记录对比</text>
  <rect x="696" y="504" width="682" height="126" rx="10" fill="#ffffff" stroke="#dbe3f0"/>
  <line x1="1037" y1="504" x2="1037" y2="630" stroke="#e2e8f0"/>
  <text x="716" y="534" class="label">招领记录 A</text>
  <text x="716" y="562" class="small">创建：finder-01 · 10:32</text>
  <text x="716" y="590" class="small">地点：教学楼 B 区 3F</text>
  <text x="1057" y="534" class="label">招领记录 B</text>
  <text x="1057" y="562" class="small">创建：finder-02 · 10:45</text>
  <text x="1057" y="590" class="small">地点：教学楼 B 区 1F</text>

  <rect x="696" y="650" width="682" height="62" rx="10" class="warning"/>
  <text x="716" y="676" class="label" fill="#c2410c">查看 PRIVATE 原图需要单独授权</text>
  <text x="716" y="700" class="small">填写理由后获得短时、单对象访问；完整号码仍不可见。</text>
  <rect x="1208" y="664" width="144" height="34" rx="6" fill="#ffffff" stroke="#f97316"/>
  <text x="1231" y="687" class="small" fill="#c2410c">申请查看原图</text>

  <text x="696" y="750" class="label">复核理由 *</text>
  <rect x="696" y="766" width="436" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="714" y="796" class="small muted">填写依据；决定和查看行为都会进入审计</text>
  <rect x="1152" y="774" width="100" height="44" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="1184" y="802" class="label" fill="#b91c1c">拒绝</text>
  <rect x="1264" y="774" width="114" height="44" rx="8" class="primary"/>
  <text x="1285" y="802" class="label" fill="#ffffff">通过待交接</text>
</svg>
