<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #172033; }
      .muted { fill: #667085; }
      .small { font-size: 14px; }
      .label { font-size: 15px; font-weight: 600; }
      .title { font-size: 28px; font-weight: 700; }
      .h2 { font-size: 20px; font-weight: 700; }
      .card { fill: #ffffff; stroke: #dbe3f0; stroke-width: 1.5; }
      .input { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; }
      .primary { fill: #2563eb; }
      .soft { fill: #eff6ff; }
      .warning { fill: #fff7ed; stroke: #fdba74; }
      .success { fill: #ecfdf3; stroke: #86efac; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f5f7fb"/>
  <rect x="0" y="0" width="1440" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#e5eaf2"/>
  <circle cx="44" cy="36" r="18" fill="#2563eb"/>
  <text x="75" y="44" font-size="22" font-weight="700">校园失物招领</text>
  <rect x="1090" y="18" width="148" height="36" rx="18" fill="#eff6ff"/>
  <text x="1114" y="42" class="small" fill="#1d4ed8">普通用户工作台</text>
  <circle cx="1300" cy="36" r="18" fill="#dbeafe"/>
  <text x="1332" y="42" class="small">finder@test</text>

  <rect x="0" y="72" width="228" height="828" fill="#ffffff"/>
  <text x="44" y="135" class="label">我丢失了物品</text>
  <rect x="18" y="156" width="192" height="48" rx="10" fill="#eff6ff"/>
  <text x="44" y="187" class="label" fill="#1d4ed8">我捡到了物品</text>
  <text x="44" y="239" class="label">我的记录</text>
  <text x="44" y="291" class="label">待交接</text>
  <line x1="24" y1="326" x2="204" y2="326" stroke="#e5e7eb"/>
  <text x="44" y="366" class="small muted">当前任务</text>
  <text x="44" y="396" class="label">确认 AI 草稿并发布</text>

  <text x="268" y="126" class="title">我捡到了物品</text>
  <text x="268" y="154" class="small muted">AI 只生成草稿；你确认后的内容才会公开和参与匹配。</text>

  <g>
    <circle cx="292" cy="197" r="16" fill="#2563eb"/><text x="287" y="202" font-size="13" fill="#ffffff">1</text>
    <line x1="308" y1="197" x2="452" y2="197" stroke="#2563eb" stroke-width="3"/>
    <circle cx="468" cy="197" r="16" fill="#2563eb"/><text x="463" y="202" font-size="13" fill="#ffffff">2</text>
    <line x1="484" y1="197" x2="628" y2="197" stroke="#2563eb" stroke-width="3"/>
    <circle cx="644" cy="197" r="16" fill="#2563eb"/><text x="639" y="202" font-size="13" fill="#ffffff">3</text>
    <line x1="660" y1="197" x2="804" y2="197" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="820" cy="197" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="815" y="202" font-size="13">4</text>
    <text x="264" y="230" class="small">上传图片</text><text x="424" y="230" class="small">确认 AI 草稿</text>
    <text x="606" y="230" class="small">核验信息</text><text x="792" y="230" class="small">预览发布</text>
  </g>

  <rect x="260" y="260" width="360" height="594" rx="16" class="card"/>
  <text x="292" y="304" class="h2">1. 原始图片与基础信息</text>
  <rect x="292" y="330" width="296" height="210" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="7 6"/>
  <rect x="334" y="364" width="212" height="124" rx="8" fill="#cbd5e1"/>
  <text x="399" y="432" class="label muted">PRIVATE 原图</text>
  <text x="364" y="516" class="small muted">候选页不能直接访问</text>
  <text x="292" y="576" class="label">拾得时间 *</text>
  <rect x="292" y="591" width="296" height="44" rx="8" class="input"/>
  <text x="310" y="619" class="small">2026-07-16 10:30</text>
  <text x="292" y="666" class="label">拾得地点 *</text>
  <rect x="292" y="681" width="296" height="44" rx="8" class="input"/>
  <text x="310" y="709" class="small">教学楼 B 区三层</text>
  <rect x="292" y="750" width="296" height="72" rx="10" class="soft"/>
  <text x="312" y="780" class="label" fill="#1d4ed8">AI 提取已完成</text>
  <text x="312" y="806" class="small">耗时 3.2s · 结果必须人工确认</text>

  <rect x="642" y="260" width="376" height="594" rx="16" class="card"/>
  <text x="674" y="304" class="h2">2. 确认 AI 草稿</text>
  <rect x="674" y="324" width="312" height="54" rx="8" class="warning"/>
  <text x="692" y="348" class="small" fill="#c2410c">AI 建议：居民身份证（置信度 0.94）</text>
  <text x="692" y="368" font-size="12" class="muted">可修改类型，修改会进入审计差异</text>
  <text x="674" y="410" class="label">物品名称 *</text>
  <rect x="674" y="425" width="312" height="44" rx="8" class="input"/>
  <text x="692" y="453" class="small">居民身份证</text>
  <text x="674" y="500" class="label">公开描述 *</text>
  <rect x="674" y="515" width="312" height="86" rx="8" class="input"/>
  <text x="692" y="543" class="small">一张居民身份证</text>
  <text x="692" y="570" class="small muted">不得包含姓名、住址或完整号码</text>
  <text x="674" y="634" class="label">证件号码逐位确认 *</text>
  <rect x="674" y="649" width="312" height="48" rx="8" class="input"/>
  <text x="692" y="680" font-size="18" letter-spacing="3">110101********123X</text>
  <rect x="674" y="716" width="20" height="20" rx="4" fill="#2563eb"/>
  <text x="680" y="731" font-size="14" fill="#ffffff">✓</text>
  <text x="704" y="731" class="small">我已对照原图逐位核对</text>
  <rect x="674" y="760" width="312" height="64" rx="10" class="success"/>
  <text x="694" y="788" class="label" fill="#15803d">确认后：计算 HMAC 并丢弃明文</text>
  <text x="694" y="812" class="small">数据库只保存 HMAC 与掩码</text>

  <rect x="1040" y="260" width="360" height="594" rx="16" class="card"/>
  <text x="1072" y="304" class="h2">3. 脱敏与发布门槛</text>
  <text x="1072" y="338" class="label">候选页图片预览</text>
  <rect x="1072" y="354" width="296" height="182" rx="12" fill="#e2e8f0"/>
  <rect x="1112" y="382" width="216" height="124" rx="8" fill="#cbd5e1"/>
  <rect x="1138" y="448" width="166" height="18" rx="4" fill="#111827"/>
  <text x="1148" y="495" class="small muted">号码/姓名/住址已遮挡</text>
  <rect x="1072" y="554" width="20" height="20" rx="4" fill="#2563eb"/>
  <text x="1078" y="569" font-size="14" fill="#ffffff">✓</text>
  <text x="1102" y="569" class="small">我已检查脱敏副本</text>
  <rect x="1072" y="594" width="296" height="100" rx="10" class="soft"/>
  <text x="1092" y="622" class="label" fill="#1d4ed8">身份证发布门槛</text>
  <text x="1092" y="649" class="small">✓ 号码逐位确认</text>
  <text x="1092" y="675" class="small">✓ 脱敏副本确认或关闭图片展示</text>
  <rect x="1072" y="716" width="296" height="66" rx="10" class="warning"/>
  <text x="1092" y="744" class="label" fill="#c2410c">切换为“其他物品”时</text>
  <text x="1092" y="768" class="small">填写隐藏描述并确认 2～3 个问题</text>
  <rect x="1208" y="800" width="160" height="42" rx="8" class="primary"/>
  <text x="1246" y="827" class="label" fill="#ffffff">预览并发布</text>
</svg>
