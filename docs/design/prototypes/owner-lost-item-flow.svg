<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #172033; }
      .muted { fill: #667085; }
      .small { font-size: 14px; }
      .label { font-size: 15px; font-weight: 600; }
      .title { font-size: 28px; font-weight: 700; }
      .h2 { font-size: 20px; font-weight: 700; }
      .card { fill: #ffffff; stroke: #dbe3f0; stroke-width: 1.5; }
      .input { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; }
      .primary { fill: #2563eb; }
      .soft { fill: #eff6ff; }
      .good { fill: #ecfdf3; stroke: #86efac; }
      .warn { fill: #fff7ed; stroke: #fdba74; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f5f7fb"/>
  <rect x="0" y="0" width="1440" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#e5eaf2"/>
  <circle cx="44" cy="36" r="18" fill="#2563eb"/>
  <text x="75" y="44" font-size="22" font-weight="700">校园失物招领</text>
  <rect x="1090" y="18" width="148" height="36" rx="18" fill="#eff6ff"/>
  <text x="1114" y="42" class="small" fill="#1d4ed8">普通用户工作台</text>
  <circle cx="1300" cy="36" r="18" fill="#dbeafe"/>
  <text x="1332" y="42" class="small">owner@test</text>

  <rect x="0" y="72" width="228" height="828" fill="#ffffff"/>
  <rect x="18" y="104" width="192" height="48" rx="10" fill="#eff6ff"/>
  <text x="44" y="135" class="label" fill="#1d4ed8">我丢失了物品</text>
  <text x="44" y="187" class="label">我捡到了物品</text>
  <text x="44" y="239" class="label">我的记录</text>
  <text x="44" y="291" class="label">认领进度</text>
  <line x1="24" y1="326" x2="204" y2="326" stroke="#e5e7eb"/>
  <text x="44" y="366" class="small muted">当前任务</text>
  <text x="44" y="396" class="label">发布失物并找候选</text>

  <text x="268" y="126" class="title">我丢失了物品</text>
  <text x="268" y="154" class="small muted">填写你记得的公开信息，系统只用这些信息生成候选。</text>

  <circle cx="296" cy="197" r="16" fill="#2563eb"/>
  <text x="291" y="202" font-size="13" fill="#ffffff">1</text>
  <line x1="312" y1="197" x2="476" y2="197" stroke="#2563eb" stroke-width="3"/>
  <circle cx="492" cy="197" r="16" fill="#2563eb"/>
  <text x="487" y="202" font-size="13" fill="#ffffff">2</text>
  <line x1="508" y1="197" x2="672" y2="197" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="688" cy="197" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="683" y="202" font-size="13">3</text>
  <line x1="704" y1="197" x2="868" y2="197" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="884" cy="197" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="879" y="202" font-size="13">4</text>
  <text x="266" y="230" class="small">填写失物</text>
  <text x="458" y="230" class="small">查看候选</text>
  <text x="652" y="230" class="small">认领核验</text>
  <text x="848" y="230" class="small">交接进度</text>

  <rect x="260" y="260" width="550" height="594" rx="16" class="card"/>
  <text x="292" y="304" class="h2">失物信息</text>
  <text x="292" y="335" class="label">物品类型 *</text>
  <rect x="292" y="350" width="486" height="46" rx="8" class="input"/>
  <text x="310" y="379" class="small">其他物品</text>
  <text x="748" y="379" class="small muted">⌄</text>
  <text x="292" y="426" class="label">物品名称 *</text>
  <rect x="292" y="441" width="486" height="46" rx="8" class="input"/>
  <text x="310" y="470" class="small muted">例如：黑色折叠伞</text>
  <text x="292" y="517" class="label">丢失时间与地点 *</text>
  <rect x="292" y="532" width="232" height="46" rx="8" class="input"/>
  <rect x="546" y="532" width="232" height="46" rx="8" class="input"/>
  <text x="310" y="561" class="small">2026-07-16 上午</text>
  <text x="564" y="561" class="small">教学楼 B 区附近</text>
  <text x="292" y="608" class="label">公开描述 *</text>
  <rect x="292" y="623" width="486" height="86" rx="8" class="input"/>
  <text x="310" y="651" class="small muted">填写颜色、形状、型号等可公开信息</text>
  <text x="310" y="677" class="small muted">不要填写只有真实失主知道的隐藏细节</text>
  <text x="292" y="742" class="label">旧照片（可选，PRIVATE）</text>
  <rect x="292" y="756" width="310" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="318" y="791" class="small">＋ 上传支持材料</text>
  <text x="616" y="780" class="small muted">不调用 AI</text>
  <text x="616" y="803" class="small muted">不参与候选评分</text>
  <rect x="638" y="820" width="140" height="42" rx="8" class="primary"/>
  <text x="675" y="847" class="label" fill="#ffffff">保存并匹配</text>

  <rect x="838" y="260" width="562" height="594" rx="16" class="card"/>
  <text x="870" y="304" class="h2">候选预览（Top 5）</text>
  <text x="870" y="332" class="small muted">候选分只表示公开信息接近，不代表物品归属。</text>
  <rect x="870" y="356" width="498" height="144" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="890" y="376" width="88" height="88" rx="8" fill="#e2e8f0"/>
  <text x="910" y="425" class="small muted">脱敏图</text>
  <text x="998" y="391" class="label">黑色短柄折叠伞</text>
  <rect x="1268" y="374" width="74" height="28" rx="14" class="good"/>
  <text x="1284" y="394" class="small" fill="#15803d">86 分</text>
  <text x="998" y="423" class="small">描述高度接近 · 时间接近</text>
  <text x="998" y="451" class="small muted">地点：教学楼相邻区域</text>
  <rect x="1226" y="458" width="116" height="30" rx="6" class="primary"/>
  <text x="1250" y="479" class="small" fill="#ffffff">查看并认领</text>

  <rect x="870" y="518" width="498" height="126" rx="12" class="card"/>
  <rect x="890" y="538" width="72" height="72" rx="8" fill="#e2e8f0"/>
  <text x="980" y="554" class="label">深色折叠伞</text>
  <rect x="1268" y="536" width="74" height="28" rx="14" class="warn"/>
  <text x="1284" y="556" class="small" fill="#c2410c">72 分</text>
  <text x="980" y="584" class="small">描述接近 · 地点较远</text>
  <text x="980" y="612" class="small muted">存在时间冲突，需谨慎核对</text>

  <rect x="870" y="670" width="498" height="146" rx="12" class="soft"/>
  <text x="894" y="706" class="label" fill="#1d4ed8">认领安全提示</text>
  <text x="894" y="736" class="small">• 身份证候选输入完整号码后只进行一次受保护比对</text>
  <text x="894" y="764" class="small">• 其他物品需要回答 2～3 个未公开问题</text>
  <text x="894" y="792" class="small">• 通过后只是“待交接”，线下完成后才是“已认领”</text>
</svg>
