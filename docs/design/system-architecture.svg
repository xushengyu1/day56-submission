  <text x="100" y="198" text-anchor="middle" font-size="11" font-weight="800" fill="#6a5a2a">数据分级保护</text>
  <line x1="42" y1="206" x2="158" y2="206" stroke="#f0ece4" stroke-width="1"/>
  <text x="42" y="224" font-size="10" fill="#5a6e7e">四级数据分类</text>
  <text x="52" y="240" font-size="9" fill="#94a3b8">· PUBLIC（公开）</text>
  <text x="52" y="254" font-size="9" fill="#94a3b8">· MATCH_ONLY（匹配专用）</text>
  <text x="52" y="268" font-size="9" fill="#94a3b8">· VERIFICATION（核验专用）</text>
  <text x="52" y="282" font-size="9" fill="#94a3b8">· PRIVATE（私密）</text>
  <text x="42" y="300" font-size="10" fill="#5a6e7e">按角色控制可见范围</text>
  <text x="42" y="316" font-size="10" fill="#5a6e7e">响应模型字段隔离</text>

  <!-- 核验机制 -->
  <rect x="32" y="343" width="136" height="130" rx="10" fill="#fff" stroke="#e8e0d4" stroke-width="1" filter="url(#ds2)"/>
  <text x="100" y="363" text-anchor="middle" font-size="11" font-weight="800" fill="#6a5a2a">核验机制</text>
  <line x1="42" y1="371" x2="158" y2="371" stroke="#f0ece4" stroke-width="1"/>
  <text x="42" y="389" font-size="10" fill="#5a6e7e">身份证件 HMAC</text>
  <text x="52" y="405" font-size="9" fill="#94a3b8">精确核验（限 2 次）</text>
  <text x="42" y="423" font-size="10" fill="#5a6e7e">隐藏特征问答核验</text>
  <text x="42" y="441" font-size="10" fill="#5a6e7e">AI 语义核验</text>
  <text x="52" y="457" font-size="9" fill="#94a3b8">+ 人工复核双重保障</text>

  <!-- 防泄露 -->
