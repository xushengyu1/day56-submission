  <text x="760" y="522" font-size="9" fill="#94a3b8">通过 / 转管理员复核</text>

  <!-- 箭头 -->
  <line x1="600" y1="539" x2="600" y2="557" stroke="#c4b8d8" stroke-width="1.2"/>
