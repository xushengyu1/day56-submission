  <text x="1042" y="534" font-size="10" fill="#5a6e7e">完整证据链追溯</text>
  <text x="1052" y="550" font-size="9" fill="#94a3b8">发布 → 匹配 → 核验</text>
  <text x="1052" y="566" font-size="9" fill="#94a3b8">→ 审核 → 交接</text>

