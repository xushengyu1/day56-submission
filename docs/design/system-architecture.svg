  <text x="1100" y="198" text-anchor="middle" font-size="11" font-weight="800" fill="#5a4a80">审计日志</text>
  <line x1="1042" y1="206" x2="1158" y2="206" stroke="#e8e4f0" stroke-width="1"/>

  <text x="1042" y="226" font-size="10" fill="#5a6e7e">操作日志记录</text>
  <text x="1052" y="242" font-size="9" fill="#94a3b8">actor + action + target</text>
  <text x="1052" y="258" font-size="9" fill="#94a3b8">+ 时间戳</text>

  <text x="1042" y="280" font-size="10" fill="#5a6e7e">AI 草稿快照</text>
  <text x="1052" y="296" font-size="9" fill="#94a3b8">原始输出与人工修改</text>
  <text x="1052" y="312" font-size="9" fill="#94a3b8">差异对比</text>

