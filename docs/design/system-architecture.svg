  <text x="600" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">拾得者</text>

  <rect x="760" y="82" width="180" height="30" rx="8" fill="#8b7bb0" filter="url(#ds2)"/>
  <text x="850" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">管理员</text>

