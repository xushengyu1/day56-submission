    </linearGradient>
    <linearGradient id="gCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0eee4"/>
      <stop offset="100%" stop-color="#d4e8dc"/>
    </linearGradient>
    <linearGradient id="gAI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e4f0"/>
      <stop offset="100%" stop-color="#dcd6ea"/>
    </linearGradient>
    <linearGradient id="gSys" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fa"/>
      <stop offset="100%" stop-color="#e8edf2"/>
    </linearGradient>
    <linearGradient id="gSec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0ece4"/>
      <stop offset="100%" stop-color="#e8e0d4"/>
    </linearGradient>
    <linearGradient id="gAudit" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#f4f0f8"/>
      <stop offset="100%" stop-color="#ece4f2"/>
    </linearGradient>
    <filter id="ds">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.07"/>
    </filter>
    <filter id="ds2">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.05"/>
