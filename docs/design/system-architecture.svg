  <rect x="20" y="148" width="160" height="560" rx="12" fill="url(#gSec)" stroke="#d4c8a8" stroke-width="1" filter="url(#ds)"/>
  <rect x="20" y="148" width="160" height="22" rx="12" fill="rgba(196,163,90,0.08)"/>
  <text x="100" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#6a5a2a">安全与防冒领</text>

