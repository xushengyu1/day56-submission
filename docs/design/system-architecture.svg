  <!-- 标题 -->
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="800" fill="#2c3e50" letter-spacing="2">AI 失物招领系统 · 功能架构图</text>

  <!-- ============================================================ -->
  <!-- 用户角色层 -->
  <!-- ============================================================ -->
