  <text x="100" y="503" text-anchor="middle" font-size="11" font-weight="800" fill="#6a5a2a">防泄露机制</text>
  <line x1="42" y1="511" x2="158" y2="511" stroke="#f0ece4" stroke-width="1"/>
  <text x="42" y="529" font-size="10" fill="#5a6e7e">证件号码 HMAC 存储</text>
  <text x="52" y="545" font-size="9" fill="#94a3b8">不落明文日志</text>
  <text x="42" y="563" font-size="10" fill="#5a6e7e">隐藏答案键不返回</text>
  <text x="42" y="581" font-size="10" fill="#5a6e7e">联系方式授权展示</text>

