  <rect x="740" y="424" width="258" height="102" rx="10" fill="#fff" stroke="#dcd6ea" stroke-width="1" filter="url(#ds2)"/>
  <text x="869" y="444" text-anchor="middle" font-size="11" font-weight="800" fill="#5a4a80">核验 AI</text>
