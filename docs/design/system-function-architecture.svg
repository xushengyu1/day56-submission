<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1410" viewBox="0 0 1600 1410" role="img" aria-labelledby="title desc">
  <title id="title">AI失物招领系统功能架构图</title>
  <desc id="desc">自上而下展示核心功能层、AI能力层、安全与防冒领层和系统支撑层。核心功能层按用户管理、拾得者、失主和管理员划分。</desc>
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5B6573" flood-opacity="0.16"/>
    </filter>
    <style>
      .font { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .layer-label { fill: #FFFFFF; font-size: 30px; font-weight: 700; text-anchor: middle; }
      .panel-title { fill: #4B5563; font-size: 25px; font-weight: 700; }
      .item { fill: #FFFFFF; font-size: 20px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
      .item-small { fill: #FFFFFF; font-size: 18px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
      .header-title { fill: #FFFFFF; font-size: 24px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1600" height="1410" fill="#FFFFFF"/>
  <text x="800" y="55" class="font" fill="#334155" font-size="36" font-weight="700" text-anchor="middle">AI失物招领系统功能架构</text>

  <!-- 核心功能层 -->
  <rect x="20" y="90" width="1560" height="410" rx="34" fill="#349CE5"/>
  <text x="88" y="275" class="font layer-label">
    <tspan x="88" dy="0">核心</tspan>
    <tspan x="88" dy="42">功能层</tspan>
  </text>

  <g filter="url(#softShadow)">
    <rect x="175" y="112" width="1380" height="74" rx="20" fill="#FFFFFF"/>
  </g>
  <text x="205" y="157" class="font panel-title">用户管理模块</text>
  <rect x="430" y="125" width="330" height="48" rx="14" fill="#349CE5"/>
  <text x="595" y="150" class="font item-small">角色权限（失主 / 拾得者 / 管理员）</text>
  <rect x="775" y="125" width="330" height="48" rx="14" fill="#349CE5"/>
  <text x="940" y="150" class="font item">注册 / 登录（JWT）</text>
  <rect x="1120" y="125" width="410" height="48" rx="14" fill="#349CE5"/>
  <text x="1325" y="150" class="font item">个人信息维护（联系方式授权）</text>

  <g filter="url(#softShadow)">
    <rect x="175" y="205" width="440" height="270" rx="26" fill="#FFFFFF"/>
    <rect x="630" y="205" width="440" height="270" rx="26" fill="#FFFFFF"/>
    <rect x="1085" y="205" width="470" height="270" rx="26" fill="#FFFFFF"/>
  </g>

  <text x="200" y="239" class="font panel-title">拾得者模块</text>
  <rect x="200" y="252" width="390" height="37" rx="11" fill="#349CE5"/>
  <text x="395" y="271" class="font item">招领信息发布</text>
  <rect x="200" y="297" width="390" height="37" rx="11" fill="#349CE5"/>
  <text x="395" y="316" class="font item">AI图片识别与特征提取</text>
  <rect x="200" y="342" width="390" height="37" rx="11" fill="#349CE5"/>
  <text x="395" y="361" class="font item">隐藏特征填写与问题设置</text>
  <rect x="200" y="387" width="390" height="37" rx="11" fill="#349CE5"/>
  <text x="395" y="406" class="font item">物品类型分流（身份证 / 其他）</text>
  <rect x="200" y="432" width="390" height="37" rx="11" fill="#349CE5"/>
  <text x="395" y="451" class="font item">认领处理与交接确认</text>

  <text x="655" y="239" class="font panel-title">失主模块</text>
  <rect x="655" y="252" width="390" height="37" rx="11" fill="#349CE5"/>
  <text x="850" y="271" class="font item">失物信息发布</text>
  <rect x="655" y="297" width="390" height="37" rx="11" fill="#349CE5"/>
  <text x="850" y="316" class="font item">AI候选匹配与结果展示（Top 5）</text>
  <rect x="655" y="342" width="390" height="37" rx="11" fill="#349CE5"/>
  <text x="850" y="361" class="font item">隐藏问题回答与核验</text>
  <rect x="655" y="387" width="390" height="37" rx="11" fill="#349CE5"/>
  <text x="850" y="406" class="font item">联系方式获取与线下交接</text>
  <rect x="655" y="432" width="390" height="37" rx="11" fill="#349CE5"/>
  <text x="850" y="451" class="font item">主动申请管理员复核</text>

  <text x="1110" y="239" class="font panel-title">管理员模块</text>
  <rect x="1110" y="252" width="420" height="37" rx="11" fill="#349CE5"/>
  <text x="1320" y="271" class="font item">多人认领仲裁</text>
  <rect x="1110" y="297" width="420" height="37" rx="11" fill="#349CE5"/>
  <text x="1320" y="316" class="font item">核验未通过复核</text>
  <rect x="1110" y="342" width="420" height="37" rx="11" fill="#349CE5"/>
  <text x="1320" y="361" class="font item">身份证件异常处理</text>
  <rect x="1110" y="387" width="420" height="37" rx="11" fill="#349CE5"/>
  <text x="1320" y="406" class="font item">复核决定与理由填写</text>
  <rect x="1110" y="432" width="420" height="37" rx="11" fill="#349CE5"/>
  <text x="1320" y="451" class="font item">操作留痕与证据链管理</text>

  <!-- AI能力层 -->
  <rect x="20" y="520" width="1560" height="250" rx="34" fill="#3DB6C8"/>
  <text x="88" y="625" class="font layer-label">
    <tspan x="88" dy="0">AI</tspan>
    <tspan x="88" dy="42">能力层</tspan>
  </text>

  <g filter="url(#softShadow)">
    <rect x="175" y="542" width="440" height="205" rx="26" fill="#FFFFFF"/>
    <rect x="630" y="542" width="440" height="205" rx="26" fill="#FFFFFF"/>
    <rect x="1085" y="542" width="470" height="205" rx="26" fill="#FFFFFF"/>
  </g>

  <text x="200" y="578" class="font panel-title">图片识别</text>
  <rect x="200" y="591" width="390" height="40" rx="11" fill="#3DB6C8"/>
  <text x="395" y="612" class="font item">多模态特征提取（名称 / 公开特征）</text>
  <rect x="200" y="639" width="390" height="40" rx="11" fill="#3DB6C8"/>
  <text x="395" y="660" class="font item">身份证件号码识别与脱敏</text>
  <rect x="200" y="687" width="390" height="40" rx="11" fill="#3DB6C8"/>
  <text x="395" y="708" class="font item">图片质量检查与异常处理</text>

  <text x="655" y="578" class="font panel-title">语义匹配</text>
  <rect x="655" y="591" width="390" height="40" rx="11" fill="#3DB6C8"/>
  <text x="850" y="612" class="font item">文本向量化（text-embedding-v4）</text>
  <rect x="655" y="639" width="390" height="40" rx="11" fill="#3DB6C8"/>
  <text x="850" y="660" class="font item">语义相似度计算（pgvector）</text>
  <rect x="655" y="687" width="390" height="40" rx="11" fill="#3DB6C8"/>
  <text x="850" y="708" class="font item-small">综合评分（类别 + 时间 + 地点 + 语义）</text>

  <text x="1110" y="578" class="font panel-title">核验AI</text>
  <rect x="1110" y="591" width="420" height="31" rx="10" fill="#3DB6C8"/>
  <text x="1320" y="607" class="font item-small">隐藏问题质量检查</text>
  <rect x="1110" y="629" width="420" height="31" rx="10" fill="#3DB6C8"/>
  <text x="1320" y="645" class="font item-small">答案泄露检测</text>
  <rect x="1110" y="667" width="420" height="31" rx="10" fill="#3DB6C8"/>
  <text x="1320" y="683" class="font item-small">认领回答语义核验</text>
  <rect x="1110" y="705" width="420" height="31" rx="10" fill="#3DB6C8"/>
  <text x="1320" y="721" class="font item-small">核验置信度评估与路由建议</text>

  <!-- 安全与防冒领层 -->
  <rect x="20" y="790" width="1560" height="250" rx="34" fill="#5575D5"/>
  <text x="88" y="885" class="font layer-label">
    <tspan x="88" dy="0">安全与</tspan>
    <tspan x="88" dy="42">防冒领层</tspan>
  </text>

  <g filter="url(#softShadow)">
    <rect x="175" y="812" width="440" height="205" rx="26" fill="#FFFFFF"/>
    <rect x="630" y="812" width="440" height="205" rx="26" fill="#FFFFFF"/>
    <rect x="1085" y="812" width="470" height="205" rx="26" fill="#FFFFFF"/>
  </g>

  <text x="200" y="848" class="font panel-title">数据分级保护</text>
  <rect x="200" y="861" width="390" height="56" rx="11" fill="#5575D5"/>
  <text x="395" y="881" class="font item-small">四级分类（PUBLIC / MATCH_ONLY /</text>
  <text x="395" y="901" class="font item-small">VERIFICATION / PRIVATE）</text>
  <rect x="200" y="925" width="390" height="36" rx="11" fill="#5575D5"/>
  <text x="395" y="944" class="font item">响应模型字段隔离</text>
  <rect x="200" y="969" width="390" height="36" rx="11" fill="#5575D5"/>
  <text x="395" y="988" class="font item">身份证件脱敏展示</text>

  <text x="655" y="848" class="font panel-title">核验机制</text>
  <rect x="655" y="861" width="390" height="40" rx="11" fill="#5575D5"/>
  <text x="850" y="882" class="font item">身份证件精确核验（HMAC）</text>
  <rect x="655" y="909" width="390" height="40" rx="11" fill="#5575D5"/>
  <text x="850" y="930" class="font item">其他物品隐藏特征核验</text>
  <rect x="655" y="957" width="390" height="40" rx="11" fill="#5575D5"/>
  <text x="850" y="978" class="font item-small">AI语义核验 + 人工复核双重保障</text>

  <text x="1110" y="848" class="font panel-title">防泄露机制</text>
  <rect x="1110" y="861" width="420" height="40" rx="11" fill="#5575D5"/>
  <text x="1320" y="882" class="font item">隐藏问题答案不公开</text>
  <rect x="1110" y="909" width="420" height="40" rx="11" fill="#5575D5"/>
  <text x="1320" y="930" class="font item">联系方式授权后展示</text>
  <rect x="1110" y="957" width="420" height="40" rx="11" fill="#5575D5"/>
  <text x="1320" y="978" class="font item">脱敏图片副本生成</text>

  <!-- 系统支撑层 -->
  <rect x="20" y="1060" width="1560" height="300" rx="34" fill="#8D8D8D"/>
  <text x="88" y="1185" class="font layer-label">
    <tspan x="88" dy="0">系统</tspan>
    <tspan x="88" dy="42">支撑层</tspan>
  </text>

  <g filter="url(#softShadow)">
    <rect x="175" y="1082" width="440" height="255" rx="26" fill="#FFFFFF"/>
    <rect x="630" y="1082" width="440" height="255" rx="26" fill="#FFFFFF"/>
    <rect x="1085" y="1082" width="470" height="255" rx="26" fill="#FFFFFF"/>
  </g>

  <text x="200" y="1120" class="font panel-title">数据存储</text>
  <rect x="200" y="1135" width="390" height="52" rx="12" fill="#8D8D8D"/>
  <text x="395" y="1162" class="font item">PostgreSQL + pgvector</text>
  <rect x="200" y="1197" width="390" height="52" rx="12" fill="#8D8D8D"/>
  <text x="395" y="1224" class="font item">SQLAlchemy ORM + Raw SQL</text>
  <rect x="200" y="1259" width="390" height="52" rx="12" fill="#8D8D8D"/>
  <text x="395" y="1286" class="font item">图片存储（原图 + 脱敏副本）</text>

  <text x="655" y="1120" class="font panel-title">状态管理</text>
  <rect x="655" y="1135" width="390" height="52" rx="12" fill="#8D8D8D"/>
  <text x="850" y="1162" class="font item">失物 / 招领记录状态流转</text>
  <rect x="655" y="1197" width="390" height="52" rx="12" fill="#8D8D8D"/>
  <text x="850" y="1224" class="font item">候选 / 认领状态管理</text>
  <rect x="655" y="1259" width="390" height="52" rx="12" fill="#8D8D8D"/>
  <text x="850" y="1286" class="font item">复核 / 交接状态追踪</text>

  <text x="1110" y="1120" class="font panel-title">日志审计</text>
  <rect x="1110" y="1135" width="420" height="52" rx="12" fill="#8D8D8D"/>
  <text x="1320" y="1162" class="font item">操作日志记录</text>
  <rect x="1110" y="1197" width="420" height="52" rx="12" fill="#8D8D8D"/>
  <text x="1320" y="1224" class="font item">AI结果快照保存</text>
  <rect x="1110" y="1259" width="420" height="52" rx="12" fill="#8D8D8D"/>
  <text x="1320" y="1286" class="font item">完整证据链追溯</text>

  <text x="800" y="1390" class="font" fill="#64748B" font-size="18" text-anchor="middle">上层面向用户任务，下层提供AI、安全、数据与运行支撑</text>
</svg>
