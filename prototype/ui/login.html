<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>登录 / 注册 - AI 失物招领系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::-webkit-scrollbar { display: none; }
    body { width: 1440px; height: 900px; overflow: hidden; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gray-50">
  <div class="flex h-screen">
    <!-- 左侧品牌区 -->
    <div class="w-[600px] h-full relative overflow-hidden">
      <img src="https://images.unsplash.com/photo-1523050854058-8df90110c8f1?w=600&h=900&fit=crop"
           alt="校园风景" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-b from-blue-900/80 to-blue-800/90 flex flex-col justify-center px-12">
        <div class="mb-8">
          <div class="w-16 h-16 bg-white/20 backdrop-blur rounded-2xl flex items-center justify-center mb-6">
            <i class="fas fa-search-location text-white text-3xl"></i>
          </div>
          <h1 class="text-white text-4xl font-bold mb-4 leading-tight">AI 失物招领<br>匹配与复核系统</h1>
          <p class="text-blue-100 text-lg leading-relaxed">基于多模态 AI 的智能匹配，让丢失的物品更快回到主人身边。</p>
        </div>
        <div class="space-y-4 mt-4">
          <div class="flex items-center gap-3 text-blue-100">
            <div class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center">
              <i class="fas fa-robot text-sm"></i>
            </div>
            <span>AI 智能特征提取与语义匹配</span>
          </div>
          <div class="flex items-center gap-3 text-blue-100">
            <div class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center">
              <i class="fas fa-shield-halved text-sm"></i>
            </div>
            <span>四级数据分类保护隐私安全</span>
          </div>
          <div class="flex items-center gap-3 text-blue-100">
            <div class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center">
              <i class="fas fa-clipboard-check text-sm"></i>
            </div>
            <span>隐藏特征核验防止冒领</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧登录区 -->
    <div class="flex-1 flex items-center justify-center bg-white">
      <div class="w-[420px]">
        <!-- 切换标签 -->
        <div class="flex mb-8 bg-gray-100 rounded-xl p-1">
          <button class="flex-1 py-3 rounded-lg text-sm font-semibold bg-white text-blue-600 shadow-sm">登录</button>
          <button class="flex-1 py-3 rounded-lg text-sm font-semibold text-gray-500">注册</button>
        </div>

        <!-- 欢迎文字 -->
        <h2 class="text-2xl font-bold text-gray-900 mb-2">欢迎回来</h2>
        <p class="text-gray-500 mb-8">登录后即可发布或查找失物信息</p>

        <!-- 登录表单 -->
        <div class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">用户名 / 邮箱</label>
            <div class="relative">
              <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input type="text" placeholder="请输入用户名或邮箱"
                     class="w-full pl-11 pr-4 py-3.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-gray-50">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input type="password" placeholder="请输入密码"
                     class="w-full pl-11 pr-11 py-3.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-gray-50">
              <button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
              <span class="text-sm text-gray-600">记住登录状态</span>
            </label>
            <a href="#" class="text-sm text-blue-600 hover:text-blue-700 font-medium">忘记密码？</a>
          </div>

          <button class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors shadow-lg shadow-blue-600/25">
            登录
          </button>
        </div>

        <!-- 分隔线 -->
        <div class="flex items-center gap-4 my-8">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span class="text-xs text-gray-400">或</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>

        <!-- 管理员入口 -->
        <button class="w-full py-3.5 border-2 border-gray-200 text-gray-700 font-semibold rounded-xl hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
          <i class="fas fa-gear text-gray-400"></i>
          管理员登录
        </button>

        <!-- 底部信息 -->
        <p class="text-center text-xs text-gray-400 mt-8">
          登录即表示同意 <a href="#" class="text-blue-600">服务条款</a> 和 <a href="#" class="text-blue-600">隐私政策</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
