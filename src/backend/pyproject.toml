[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lost-found-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.4",
  "asyncpg==0.30.0",
  "dashscope==1.26.3",
  "fastapi==0.116.1",
  "pillow==11.3.0",
  "pyjwt==2.10.1",
  "pgvector==0.4.1",
  "pwdlib[argon2]==0.2.1",
  "python-multipart==0.0.20",
  "pydantic-settings==2.10.1",
  "sqlalchemy[asyncio]==2.0.41",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
